<!-- The test harness that runs inside the browser's Python (Pyodide). -->
<script type="text/x-python" id="harness">
import json, sys, io, time, ast

# Code the student (or the course) wrote is compiled under these names, so the
# watchdog below can tell it apart from library code such as numpy or pandas.
_SCIM_FILES = ('<student>', '<setup>', '<scratch>')
_SCIM_LIBS = "numpy, pandas, scipy, matplotlib, sympy, scikit-learn, networkx, statistics, math, random"

_scim_deadline = [0.0]
_scim_ticks = [0]


def _scim_tracer(frame, event, arg):
    """Stops a program that never ends. It only follows the student's own code:
    tracing every line of pandas or numpy would make them crawl."""
    _scim_ticks[0] += 1
    if (_scim_ticks[0] & 0xFF) == 0 and time.time() > _scim_deadline[0]:
        raise TimeoutError('your program ran too long - check for a loop that never ends')
    return _scim_tracer if frame.f_code.co_filename in _SCIM_FILES else None


def _scim_arm(limit):
    _scim_deadline[0] = time.time() + limit
    sys.settrace(_scim_tracer)


# ---------------------------------------------------------------- input() ---
# There is no keyboard behind a web page, so Python's own input() fails. These
# stand in for it: one hands over the lines a test provides, one asks the person
# sitting at the browser, and one explains itself when a problem has no input.

class _ScimFeed(object):
    """input() for a graded test - hands back the prepared lines, one per call."""
    def __init__(self, lines):
        self.lines = list(lines)

    def __call__(self, prompt=''):
        # The prompt is deliberately NOT printed: only what the program itself
        # prints is compared, so wording the question differently is harmless.
        if not self.lines:
            raise EOFError('your program asked for more input than this test gives it')
        return self.lines.pop(0)


def _scim_ask(prompt=''):
    """input() on the scratch pad - a real question box in the browser."""
    try:
        import js
        answer = js.window.prompt(str(prompt) if prompt else 'Input:')
    except Exception:
        raise RuntimeError('input() cannot ask for anything here')
    if answer is None:
        raise EOFError('you closed the question box, so there was nothing to read')
    return str(answer)


def _scim_no_input(prompt=''):
    raise RuntimeError('this problem gives no input, so input() cannot be used - '
                       'write a function that returns a value instead')


def _scim_lines(t):
    """The input a test provides: a list of lines, or one string with newlines."""
    v = t.get('input')
    if v is None:
        return None
    if isinstance(v, str):
        return v.replace('\r\n', '\n').split('\n')
    return [str(x) for x in v]


def _scim_text(s):
    """Printed output, tidied so that stray spaces and blank lines do not fail
    an otherwise correct answer."""
    lines = [ln.rstrip() for ln in str(s).replace('\r\n', '\n').split('\n')]
    while lines and lines[0] == '':
        lines.pop(0)
    while lines and lines[-1] == '':
        lines.pop()
    return '\n'.join(lines)


def _scim_expected_text(exp):
    if isinstance(exp, (list, tuple)):
        return _scim_text('\n'.join(str(x) for x in exp))
    return _scim_text('' if exp is None else exp)


def _scim_is_program(t):
    """A test with neither "call" nor "expr" runs the whole program and looks at
    what it printed."""
    return 'call' not in t and 'expr' not in t


# ------------------------------------------------------------- comparing ----

def _scim_plain(v):
    """numpy / pandas values -> ordinary Python, so that a numpy array can be
    compared with the plain JSON list written in the test."""
    if v is None or type(v) in (list, tuple, dict, set, str, bytes, bool, int, float):
        return v          # exact types only, so a numpy float still gets converted
    tolist = getattr(v, 'tolist', None)
    if callable(tolist):
        try:
            return tolist()
        except Exception:
            return v
    item = getattr(v, 'item', None)
    if callable(item):
        try:
            return item()
        except Exception:
            return v
    return v


def _scim_cmp(got, exp):
    got = _scim_plain(got)
    if isinstance(exp, bool) or isinstance(got, bool):
        return isinstance(exp, bool) and isinstance(got, bool) and exp == got
    if isinstance(exp, (int, float)) and isinstance(got, (int, float)):
        return abs(float(got) - float(exp)) <= 1e-6 * max(1.0, abs(float(exp)))
    if isinstance(exp, list):
        if not isinstance(got, (list, tuple)) or len(got) != len(exp):
            return False
        return all(_scim_cmp(g, e) for g, e in zip(got, exp))
    if isinstance(exp, dict):
        if not isinstance(got, dict) or set(got.keys()) != set(exp.keys()):
            return False
        return all(_scim_cmp(got[k], exp[k]) for k in exp)
    if exp is None:
        return got is None
    return got == exp


def _scim_label(t):
    if 'expr' in t:
        return t['expr']
    if 'call' in t:
        base = '%s(%s)' % (t['call'], ', '.join(repr(a) for a in t.get('args', [])))
        lines = _scim_lines(t)
        return base + (' with input ' + ', '.join(lines) if lines else '')
    lines = _scim_lines(t)
    return 'your program with input ' + ', '.join(lines) if lines else 'your program'


def _scim_why(e):
    """A short, friendly one-line explanation, with the line number when we can
    find it inside the student's own code."""
    msg = '%s: %s' % (type(e).__name__, e)
    if isinstance(e, ModuleNotFoundError):
        msg += ' - that package is not available in the browser. You can use: ' + _SCIM_LIBS
    line = None
    tb = getattr(e, '__traceback__', None)
    while tb is not None:
        if tb.tb_frame.f_code.co_filename in _SCIM_FILES:
            line = tb.tb_lineno
        tb = tb.tb_next
    if line:
        msg += '   [line %d of your code]' % line
    return msg


def _scim_figure():
    """If the code drew a matplotlib chart, hand it back as a PNG."""
    try:
        plt = sys.modules.get('matplotlib.pyplot')
        if plt is None or not plt.get_fignums():
            return ''
        import base64
        buf = io.BytesIO()
        plt.savefig(buf, format='png', dpi=110, bbox_inches='tight')
        plt.close('all')
        return base64.b64encode(buf.getvalue()).decode()
    except Exception:
        return ''


# ------------------------------------------------------------- the runs -----

def _scim_program(code, setup, lines, limit):
    """One whole run of the student's program with its own fresh memory and its
    own prepared input. Returns (what it printed, error or None)."""
    ns = {'__name__': '__main__', 'input': _ScimFeed(lines or [])}
    buf = io.StringIO()
    real_stdout = sys.stdout
    sys.stdout = buf
    try:
        _scim_arm(limit)
        if setup:
            exec(compile(setup, '<setup>', 'exec'), ns)
        exec(compile(code, '<student>', 'exec'), ns)
        return buf.getvalue(), None
    except Exception as e:
        return buf.getvalue(), _scim_why(e)
    finally:
        sys.settrace(None)
        sys.stdout = real_stdout


def _scim_run(code, setup, tests_json, limit):
    """Graded run. Three shapes of test are understood:
         {"call": "add", "args": [2, 3], "expected": 5}
         {"expr": "squares", "expected": [1, 4, 9]}
         {"input": ["5", "7"], "expected": "12"}      <- runs the whole program
    """
    tests = json.loads(tests_json)
    needs_ns = any(not _scim_is_program(t) for t in tests)

    ns = {'__name__': '__main__', 'input': _scim_no_input}
    start_error = None
    buf = io.StringIO()

    if needs_ns:
        real_stdout = sys.stdout
        sys.stdout = buf
        try:
            if setup:
                try:
                    _scim_arm(limit)
                    exec(compile(setup, '<setup>', 'exec'), ns)
                finally:
                    sys.settrace(None)
        except Exception as e:
            sys.stdout = real_stdout
            return json.dumps({'error': 'Course setup failed - %s: %s' % (type(e).__name__, e)})
        try:
            _scim_arm(limit)
            exec(compile(code, '<student>', 'exec'), ns)
        except Exception as e:
            start_error = _scim_why(e)
        finally:
            sys.settrace(None)
            sys.stdout = real_stdout
        if start_error and all(not _scim_is_program(t) for t in tests):
            return json.dumps({'error': start_error, 'stdout': buf.getvalue()})

    results = []
    for t in tests:
        label = _scim_label(t)
        expected = t.get('expected')

        if _scim_is_program(t):
            printed, err = _scim_program(code, setup, _scim_lines(t), limit)
            want = _scim_expected_text(expected)
            if err:
                results.append({'label': label, 'expected': repr(want), 'got': err, 'ok': False})
            else:
                got = _scim_text(printed)
                results.append({'label': label, 'expected': repr(want),
                                'got': repr(got), 'ok': got == want})
            continue

        if start_error:
            results.append({'label': label, 'expected': repr(expected),
                            'got': start_error, 'ok': False})
            continue

        lines = _scim_lines(t)
        ns['input'] = _ScimFeed(lines) if lines is not None else _scim_no_input
        _scim_arm(limit)          # re-arm: a raised timeout switches tracing off
        try:
            if 'expr' in t:
                got = eval(compile(t['expr'], '<student>', 'eval'), ns)
            else:
                fn = ns.get(t['call'])
                if not callable(fn):
                    raise NameError("there is no function called '%s'" % t['call'])
                got = fn(*t.get('args', []))
            results.append({'label': label, 'expected': repr(expected),
                            'got': repr(_scim_plain(got)), 'ok': _scim_cmp(got, expected)})
        except Exception as e:
            results.append({'label': label, 'expected': repr(expected),
                            'got': '%s: %s' % (type(e).__name__, e), 'ok': False})
        finally:
            sys.settrace(None)

    return json.dumps({'results': results, 'stdout': buf.getvalue()})


def _scim_scratch(setup, answer, code, limit):
    """Scratch pad run: anything goes, nothing is graded.

    The problem's setup code and the answer the student is writing in the main
    editor are both run first, so the pad can call the function they just wrote.
    input() here opens a question box in the browser."""
    out = {'stdout': '', 'value': '', 'error': '', 'image': '', 'answer_error': ''}
    ns = {'__name__': '__main__', 'input': _scim_ask}
    buf = io.StringIO()
    real_stdout = sys.stdout
    sys.stdout = buf
    try:
        if setup:
            try:
                _scim_arm(limit)
                exec(compile(setup, '<setup>', 'exec'), ns)
            except Exception:
                pass                                  # the setup is not what is being tried out
            finally:
                sys.settrace(None)
        if answer and answer.strip():
            try:
                _scim_arm(limit)
                exec(compile(answer, '<student>', 'exec'), ns)
            except Exception as e:
                out['answer_error'] = _scim_why(e)    # keep going - the pad is still useful
            finally:
                sys.settrace(None)
            buf.truncate(0)                           # anything the answer printed is not the pad's output
            buf.seek(0)
        try:
            tree = ast.parse(code)
        except SyntaxError as e:
            out['error'] = 'SyntaxError: %s   [line %s]' % (e.msg, e.lineno)
            return json.dumps(out)
        tail = None
        if tree.body and isinstance(tree.body[-1], ast.Expr):
            tail = ast.Expression(tree.body.pop().value)
        try:
            _scim_arm(limit)
            exec(compile(tree, '<scratch>', 'exec'), ns)
            if tail is not None:
                value = eval(compile(tail, '<scratch>', 'eval'), ns)
                if value is not None:
                    out['value'] = repr(value)
        except Exception as e:
            out['error'] = _scim_why(e)
        finally:
            sys.settrace(None)
        out['image'] = _scim_figure()
    finally:
        sys.stdout = real_stdout
        out['stdout'] = buf.getvalue()
    return json.dumps(out)
</script>

<script>
(async function () {
  const S = window.SCIM;
  if (!S.configured) { location.href = "index.html"; return; }

  const weekNo = parseInt(new URLSearchParams(location.search).get("week") || "1", 10);
  const ctx = await S.getSession();
  if (!ctx) { location.href = "index.html"; return; }
  S.fillHeader(ctx);
  document.getElementById("signed-line").textContent =
    "Signed in as " + ctx.email + " — every attempt and score is saved.";

  /* ---------------- load content ---------------- */
  const [weekRes, probRes, allProbRes, passRes] = await Promise.all([
    S.sb.from("weeks").select("*").eq("week_no", weekNo).maybeSingle(),
    S.sb.from("problems").select("*").eq("week_no", weekNo).eq("is_active", true)
        .order("level").order("sort_order"),
    S.sb.from("problems").select("slug,points").eq("is_active", true),
    S.sb.from("attempts").select("problem_id").eq("passed", true)
  ]);

  const week = weekRes.data || { week_no: weekNo, title: "Week " + weekNo, subtitle: "" };
  /* the number the students see - may be shared by several topic cards */
  const weekLabel = (week.display_no != null ? week.display_no : week.week_no);
  const problems = probRes.data || [];
  const pointsBySlug = {};
  (allProbRes.data || []).forEach(p => { pointsBySlug[p.slug] = p.points; });
  const solved = new Set((passRes.data || []).map(a => a.problem_id));

  document.getElementById("week-heading").textContent =
    S.cfg.COURSE_CODE + " · Week " + weekLabel;
  document.getElementById("week-sub").textContent = week.title;
  document.title = S.cfg.COURSE_CODE + " · Week " + weekLabel + " · " + week.title;

  function refreshPoints() {
    let total = 0;
    solved.forEach(slug => { total += pointsBySlug[slug] || 0; });
    document.getElementById("points").textContent = total;
  }
  refreshPoints();

  if (!problems.length) {
    document.getElementById("empty").classList.remove("hidden");
    return;
  }
  document.getElementById("problem-area").classList.remove("hidden");

  /* ---------------- levels & locking ---------------- */
  const levels = [];
  problems.forEach(p => {
    let lv = levels.find(l => l.level === p.level);
    if (!lv) {
      lv = { level: p.level, title: p.level_title || ("Level " + p.level),
             subtitle: p.level_subtitle || "", items: [] };
      levels.push(lv);
    }
    lv.items.push(p);
  });
  levels.sort((a, b) => a.level - b.level);

  const isUnlocked = (index) => {
    if (index === 0) return true;
    return levels[index - 1].items.every(p => solved.has(p.slug));
  };

  let current = null;

  function renderPath() {
    const html = levels.map((lv, i) => {
      const unlocked = isUnlocked(i);
      const items = lv.items.map(p => {
        const cls = ["pitem"];
        if (solved.has(p.slug)) cls.push("solved");
        if (!unlocked) cls.push("locked");
        if (current && current.id === p.id) cls.push("active");
        return '<li class="' + cls.join(" ") + '" data-slug="' + S.esc(p.slug) + '">' +
               '<span class="ring"></span><span>' + S.esc(p.title) + "</span>" +
               (unlocked ? "" : '<span class="lock">🔒</span>') + "</li>";
      }).join("");
      return '<div class="level ' + (unlocked ? "unlocked" : "locked") + '">' +
             '<div class="level-head"><div class="level-num">' + lv.level + "</div><div>" +
             "<b>Week " + weekLabel + " · " + S.esc(lv.title) + "</b>" +
             "<span>" + (unlocked ? S.esc(lv.subtitle) : "Finish the level above to unlock") + "</span>" +
             '</div></div><ul class="plist">' + items + "</ul></div>";
    }).join("");
    const box = document.getElementById("path");
    box.innerHTML = html;
    box.querySelectorAll(".pitem").forEach(el => {
      el.onclick = () => {
        if (el.classList.contains("locked")) {
          S.toast("Finish the level above first 🔒");
          return;
        }
        select(problems.find(p => p.slug === el.dataset.slug));
      };
    });
  }

  /* ---------------- editor ---------------- */
  /* ---------------- editor helpers ----------------
     Everything both editors share: the suggestion list, the faint indent lines,
     and the settings they are created with. */
  const INDENT = 4;

  const PY_WORDS = (
    "False None True and as assert async await break class continue def del elif else except " +
    "finally for from global if import in is lambda nonlocal not or pass raise return try while " +
    "with yield " +
    "abs all any bin bool chr dict divmod enumerate eval filter float format frozenset getattr " +
    "hasattr hex id input int isinstance issubclass len list map max min next object oct ord pow " +
    "print range repr reversed round set setattr sorted str sum tuple type zip " +
    "append count endswith extend find index insert isalpha isdigit items join keys lower pop " +
    "remove replace reverse sort split startswith strip title upper values " +
    "math random statistics numpy pandas self"
  ).split(" ");

  /* Suggestions = Python's own words + every name already written on the page. */
  if (window.CodeMirror && CodeMirror.registerHelper) {
    CodeMirror.registerHelper("hint", "scim", function (cm) {
      const cur = cm.getCursor();
      const line = cm.getLine(cur.line);
      let start = cur.ch;
      while (start && /[\w$]/.test(line.charAt(start - 1))) start--;
      const typed = line.slice(start, cur.ch);
      if (!typed) return null;

      const seen = Object.create(null);
      PY_WORDS.forEach(w => { seen[w] = true; });
      const words = cm.getValue().match(/[A-Za-z_][A-Za-z0-9_]*/g) || [];
      words.forEach(w => { if (w !== typed) seen[w] = true; });

      const lower = typed.toLowerCase();
      const list = Object.keys(seen)
        .filter(w => w.length > typed.length && w.toLowerCase().indexOf(lower) === 0)
        .sort((a, b) => (a.toLowerCase() < b.toLowerCase() ? -1 : 1))
        .slice(0, 20);
      if (!list.length) return null;
      return { list: list, from: CodeMirror.Pos(cur.line, start), to: CodeMirror.Pos(cur.line, cur.ch) };
    });
  }

  /* A faint vertical line at the start of each level of indentation. The font is
     monospace, so one character is exactly 1ch and the lines land on the columns. */
  function drawIndentGuides(cm, line, elt) {
    const spaces = /^ */.exec(line.text)[0].length;
    const levels = Math.floor(spaces / INDENT);
    if (!levels) { elt.style.backgroundImage = ""; return; }
    elt.style.backgroundImage =
      "repeating-linear-gradient(to right, var(--guide) 0 1px, transparent 1px " + INDENT + "ch)";
    elt.style.backgroundSize = (levels * INDENT) + "ch 100%";
    elt.style.backgroundRepeat = "no-repeat";
    elt.style.backgroundOrigin = "content-box";
  }

  function editorOptions() {
    return {
      mode: "python", theme: cmTheme(), lineNumbers: true,
      indentUnit: INDENT, tabSize: INDENT, indentWithTabs: false, lineWrapping: true,
      autoCloseBrackets: !!(window.CodeMirror && CodeMirror.defaults.autoCloseBrackets !== undefined),
      extraKeys: {
        Tab: (c) => c.replaceSelection("    "),
        "Ctrl-Space": (c) => { if (c.showHint) c.showHint({ hint: CodeMirror.hint.scim }); }
      }
    };
  }

  /* Suggest as they type, but never get in the way: only after two letters, and
     never while they are in the middle of a word they have already finished. */
  function attachEditorHelpers(editor) {
    editor.on("renderLine", drawIndentGuides);
    editor.on("inputRead", function (cm, change) {
      if (!cm.showHint || !CodeMirror.hint || !CodeMirror.hint.scim) return;
      if (change.origin !== "+input" || change.text.length !== 1) return;
      if (!/[A-Za-z_]/.test(change.text[0])) return;
      const cur = cm.getCursor();
      const before = cm.getLine(cur.line).slice(0, cur.ch);
      if (!/[A-Za-z_][A-Za-z0-9_]$/.test(before)) return;      // wait for the second letter
      cm.showHint({ hint: CodeMirror.hint.scim, completeSingle: false });
    });
    editor.refresh();
  }

  /* CodeMirror ships a dark and a light theme; follow whichever the page is in */
  const cmTheme = () => (S.isLight && S.isLight() ? "default" : "material-darker");
  window.addEventListener("scim-theme", () => {
    if (cm) cm.setOption("theme", cmTheme());
    if (scm) scm.setOption("theme", cmTheme());
  });

  let cm = null;
  const textarea = document.getElementById("code");
  if (window.CodeMirror) {
    cm = CodeMirror.fromTextArea(textarea, editorOptions());
    attachEditorHelpers(cm);
  }
  const getCode = () => (cm ? cm.getValue() : textarea.value);
  const setCode = (v) => { cm ? cm.setValue(v) : (textarea.value = v); };
  const draftKey = (p) => "scim105:draft:" + p.slug;
  let saveTimer = null;
  const onEdit = () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      if (current) localStorage.setItem(draftKey(current), getCode());
    }, 400);
  };
  cm ? cm.on("change", onEdit) : textarea.addEventListener("input", onEdit);

  /* ---------------- scratch pad (one per problem, never graded) --------- */
  const scratchArea = document.getElementById("scratch-code");
  const scratchOut = document.getElementById("scratch-out");
  const scratchStatusEl = document.getElementById("scratch-status");
  const saySc = (t) => { scratchStatusEl.textContent = t; };
  const SCRATCH_START = "";          /* the pad starts empty */

  let scm = null;
  const scratchKey = (p) => "scim105:scratch:" + p.slug;
  const getScratch = () => (scm ? scm.getValue() : scratchArea.value);
  const setScratch = (v) => { scm ? scm.setValue(v) : (scratchArea.value = v); };

  function loadScratch(p) {
    setScratch(localStorage.getItem(scratchKey(p)) || SCRATCH_START);
    scratchOut.innerHTML = "";
    saySc("");
    if (scm) setTimeout(() => scm.refresh(), 30);
  }

  let scratchTimer = null;
  const onScratchEdit = () => {
    clearTimeout(scratchTimer);
    scratchTimer = setTimeout(() => {
      if (current) localStorage.setItem(scratchKey(current), getScratch());
    }, 400);
  };
  scratchArea.addEventListener("input", onScratchEdit);

  /* CodeMirror measures badly in a hidden column, so build it when it opens */
  function buildScratchEditor() {
    if (scm || !window.CodeMirror) return;
    scm = CodeMirror.fromTextArea(scratchArea, editorOptions());
    attachEditorHelpers(scm);
    scm.on("change", onScratchEdit);
  }

  /* open / close the panel; both editors need a nudge because the columns resize */
  const splitBox = document.querySelector(".split");
  const padToggle = document.getElementById("scratch-toggle");
  const PAD_KEY = "scim105:padopen";

  /* On a narrow screen the pad floats over the page. Tell the stylesheet how
     tall the header is, so it opens below it and Sign out stays reachable. */
  function measureHead() {
    const bar = document.querySelector(".topbar");
    const strip = document.querySelector(".banner");
    const h = (bar ? bar.offsetHeight : 0) + (strip ? strip.offsetHeight : 0);
    document.documentElement.style.setProperty("--head-h", h + "px");
  }
  measureHead();
  window.addEventListener("resize", measureHead);

  function showPad(open) {
    measureHead();
    splitBox.classList.toggle("pad-open", open);
    padToggle.textContent = open ? "\u{1F9EA} Hide scratch pad" : "\u{1F9EA} Scratch pad";
    try { localStorage.setItem(PAD_KEY, open ? "1" : "0"); } catch (e) {}
    if (open) buildScratchEditor();
    setTimeout(() => { if (scm) scm.refresh(); if (cm) cm.refresh(); }, 40);
  }
  padToggle.onclick = () => showPad(!splitBox.classList.contains("pad-open"));
  document.getElementById("scratch-close").onclick = () => showPad(false);
  showPad((() => { try { return localStorage.getItem(PAD_KEY) === "1"; } catch (e) { return false; } })());

  document.getElementById("scratch-clear").onclick = () => {
    if (current) localStorage.removeItem(scratchKey(current));
    setScratch(SCRATCH_START);
    scratchOut.innerHTML = "";
    saySc("");
  };

  const scratchBtn = document.getElementById("scratch-run");
  scratchBtn.onclick = async function () {
    if (!current) return;
    const code = getScratch();
    scratchBtn.disabled = true;
    scratchOut.innerHTML = "";
    try {
      const py = await python(saySc);
      const answer = getCode();                       // what is in the main editor right now
      const source = (current.setup_code || "") + "\n" + answer + "\n" + code;
      await prepare(py, source, saySc);
      saySc("Running…");
      const fn = py.globals.get("_scim_scratch");
      const raw = fn(current.setup_code || "", answer, code, limitFor(source));
      fn.destroy && fn.destroy();
      const out = JSON.parse(raw);
      saySc("");

      const printed = (out.stdout || "").replace(/\s+$/, "");
      let html = "";
      if (out.answer_error) {
        html += '<div class="note">The answer in the editor on the left could not run, so the pad ' +
                "ran without it \u2014 " + S.esc(out.answer_error) + "</div>";
      }
      if (out.image) {
        html += '<img class="figure" alt="the chart your code drew" ' +
                'src="data:image/png;base64,' + out.image + '">';
      }
      if (printed) html += '<div class="stdout">' + S.esc(printed) + "</div>";
      if (out.value) html += '<div class="stdout value">' + S.esc(out.value) + "</div>";
      if (out.error) {
        html += '<div class="result-head fail"><div class="msg">' + S.esc(out.error) + "</div></div>";
      }
      if (!html) {
        html = '<div class="stdout">It ran, but nothing came out. ' +
               "Add print(\u2026) - or put a value on the last line - to see something.</div>";
      }
      scratchOut.innerHTML = html;
    } catch (err) {
      saySc("");
      scratchOut.innerHTML =
        '<div class="result-head fail"><div class="msg">Could not run that: ' +
        S.esc(err.message) + "</div></div>";
    } finally {
      scratchBtn.disabled = false;
    }
  };

  /* ---------------- show one problem ---------------- */
  function select(p) {
    if (!p) return;
    current = p;
    document.getElementById("crumbs").textContent =
      "Level " + p.level + " · Week " + weekLabel + " · " + (p.level_title || "");
    document.getElementById("p-title").textContent = p.title;
    document.getElementById("p-statement").innerHTML = p.statement;
    document.getElementById("p-example").textContent = p.example || "";
    document.getElementById("fname").textContent = (p.entry_name || "solution") + ".py";
    document.getElementById("p-example").className = p.example ? "example" : "example hidden";
    document.getElementById("results").innerHTML = "";
    document.getElementById("status").textContent = "";
    setCode(localStorage.getItem(draftKey(p)) || p.starter_code || "");
    loadScratch(p);
    renderPath();
    if (cm) setTimeout(() => cm.refresh(), 30);
  }

  const firstUnsolved = () => {
    for (let i = 0; i < levels.length; i++) {
      if (!isUnlocked(i)) break;
      const item = levels[i].items.find(p => !solved.has(p.slug));
      if (item) return item;
    }
    return problems[0];
  };
  select(firstUnsolved());

  /* ---------------- Python in the browser ---------------- */
  let pyodide = null;
  function loadScript(src) {
    return new Promise((ok, bad) => {
      const s = document.createElement("script");
      s.src = src; s.onload = ok; s.onerror = () => bad(new Error("Could not load " + src));
      document.head.appendChild(s);
    });
  }
  async function python(setStatus) {
    if (pyodide) return pyodide;
    setStatus("Starting Python in your browser… (first run only)");
    if (!window.loadPyodide) {
      await loadScript("https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js");
    }
    pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" });
    pyodide.runPython(document.getElementById("harness").textContent);
    return pyodide;
  }

  const runBtn = document.getElementById("run");
  const statusEl = document.getElementById("status");
  const setStatus = (t) => { statusEl.textContent = t; };

  /* ---------------- scientific libraries ---------------- */
  /* Pyodide fetches a package the first time some code imports it, then the
     browser keeps it. Packages are big, so a run that uses one gets more time. */
  const BASE_LIMIT = S.cfg.RUN_TIMEOUT_SECONDS || 6;
  const LIB_RE =
    /\b(numpy|pandas|scipy|matplotlib|sympy|sklearn|networkx|statsmodels|PIL|pytz|dateutil)\b/;
  const limitFor = (source) => LIB_RE.test(source) ? Math.max(BASE_LIMIT, 30) : BASE_LIMIT;

  async function prepare(py, source, say) {
    if (!LIB_RE.test(source)) return;
    say("Getting the libraries your code imports… the first time this can take a minute.");
    try {
      await py.loadPackagesFromImports(source, { messageCallback: () => {}, errorCallback: () => {} });
    } catch (e) {
      /* an unknown package is reported by Python itself, with a friendlier message */
    }
    if (/matplotlib/.test(source)) {
      /* draw into a picture instead of onto a canvas the page does not have */
      try { py.runPython("import matplotlib\nmatplotlib.use('AGG')\n"); } catch (e) {}
    }
  }

  document.getElementById("reset").onclick = () => {
    if (!current) return;
    if (!confirm("Replace your code with the original starter code?")) return;
    localStorage.removeItem(draftKey(current));
    setCode(current.starter_code || "");
  };

  runBtn.onclick = async function () {
    if (!current) return;
    const code = getCode();
    runBtn.disabled = true;
    document.getElementById("results").innerHTML = "";
    try {
      const py = await python(setStatus);
      const source = (current.setup_code || "") + "\n" + code;
      await prepare(py, source, setStatus);
      setStatus("Running your code…");
      const runner = py.globals.get("_scim_run");
      const raw = runner(code, current.setup_code || "",
                         JSON.stringify(current.tests || []), limitFor(source));
      runner.destroy && runner.destroy();
      const out = JSON.parse(raw);
      setStatus("");
      showResults(out, code);
    } catch (err) {
      setStatus("");
      document.getElementById("results").innerHTML =
        '<div class="result-head fail"><div class="msg">Could not run your code: ' +
        S.esc(err.message) + "</div></div>";
    } finally {
      runBtn.disabled = false;
    }
  };

  function showResults(out, code) {
    const box = document.getElementById("results");
    const tests = (current.tests || []).length;

    if (out.error) {
      box.innerHTML =
        '<div class="result-head fail"><div class="score">0/' + tests + "</div>" +
        '<div class="msg">Your program could not start — fix the error below.</div></div>' +
        '<div class="stdout">' + S.esc(out.error) + "</div>";
      save(false, 0, tests, code);
      return;
    }

    const results = out.results || [];
    const passedCount = results.filter(r => r.ok).length;
    const allPassed = tests > 0 && passedCount === tests;

    let html =
      '<div class="result-head ' + (allPassed ? "pass" : "fail") + '">' +
      '<div class="score">' + passedCount + "/" + tests + "</div>" +
      '<div class="msg">' + (allPassed
        ? "All tests passed. Well done! +" + (current.points || 0) + " pts"
        : passedCount + " of " + tests + " tests passed. Keep going!") + "</div></div>";

    html += results.map(r =>
      '<div class="tcase ' + (r.ok ? "ok" : "no") + '"><div class="mark">' +
      (r.ok ? "✓" : "✕") + '</div><div class="body">' + S.esc(r.label) +
      '<div class="sub"><b>expected</b> ' + S.esc(r.expected) +
      (r.ok ? "" : " · <b>got</b> " + S.esc(r.got)) + "</div></div></div>").join("");

    if (out.stdout && out.stdout.trim()) {
      html += '<div class="stdout">Printed output:\n' + S.esc(out.stdout) + "</div>";
    }
    box.innerHTML = html;

    const wasSolved = solved.has(current.slug);
    if (allPassed) solved.add(current.slug);
    save(allPassed, passedCount, tests, code);
    if (allPassed && !wasSolved) {
      refreshPoints();
      S.toast("Solved! +" + (current.points || 0) + " points 🎉", "ok");
    }
    renderPath();
  }

  async function save(passed, score, total, code) {
    const { error } = await S.sb.from("attempts").insert({
      user_id: ctx.user.id, email: ctx.email, full_name: ctx.name,
      week_no: week.week_no, problem_id: current.slug, level: current.level,
      passed: passed, score: score, total_tests: total, code: code
    });
    if (error) S.toast("Could not save this attempt: " + error.message, "err");
  }
})();
</script>
</body>
</html>
