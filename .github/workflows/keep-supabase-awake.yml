# =====================================================================
#  Keeps the free Supabase project from being paused.
#
#  A Free plan project sleeps after 7 days with no database activity.
#  This sends one small read every day, which is enough to keep it awake
#  during the holidays. Nothing to set up: the address and the public
#  anon key are read from assets/config.js in this repository.
#
#  If a run fails, GitHub e-mails you - that is your warning that the
#  project is already asleep and needs Restore project in the dashboard.
# =====================================================================
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 2 * * *"      # every day at 02:17 UTC  (09:17 in Thailand)
    - cron: "17 3 1 * *"      # 1st of the month - see the last step
  workflow_dispatch:           # also lets you press "Run workflow" by hand

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send one read to the database
        run: node .github/scripts/ping-supabase.mjs

      # GitHub switches off scheduled workflows in a repository that has had
      # no commits for 60 days. One tiny commit a month stops that happening
      # over a long holiday.
      - name: Monthly commit so GitHub keeps this schedule running
        if: github.event.schedule == '17 3 1 * *'
        run: |
          date -u +"last automatic keep-alive: %Y-%m-%d %H:%M UTC" > .github/last-keepalive.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive.txt
          git commit -m "chore: monthly keep-alive" || exit 0
          git push
